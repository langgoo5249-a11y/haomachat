name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史: 便于必要时回溯 URL 变更
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # ── 恢复上一版 sitemap, 作为本次增量 diff 的基线 ──
      #
      # 2026-10-15 修正: 原写法用 actions/download-artifact@v4 但不带 run-id,
      # 它只会在「当前这次 run」里找 artifact — 而 artifact 是在本 run 末尾才
      # 上传的, 所以必然找不到(日志: Artifact not found), 且 continue-on-error
      # 把失败显示成 success, 问题被完全掩盖。
      #
      # 现在改为显式从上一次成功的 run 取, 并用 shell 检查文件是否真的落盘。
      # 找不到时脚本会退化到「线上 sitemap」作基线, 仍可正确增量。
      - name: Resolve previous run id
        id: prev
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
              { owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'deploy.yml', status: 'success', per_page: 5 }
            );
            const prev = runs.find(r => r.head_sha !== context.sha);
            if (prev) {
              core.info(`previous successful run: ${prev.id}`);
              core.setOutput('run-id', String(prev.id));
            } else {
              core.info('no previous successful run (first deployment)');
            }

      - name: Restore previous IndexNow baseline
        if: steps.prev.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-snapshot
          path: scripts/.indexnow-snapshot
          run-id: ${{ steps.prev.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f613aea61669133c77d8364ac2e50b66
          command: pages deploy dist --project-name=haomachat --branch=main

      # ── 通知搜索引擎: 本次发布的 URL 新增 / 修改 / 删除 ──
      # 优先级高于 sitemap: sitemap 只说明「URL 存在」, IndexNow 才说明
      # 「这个 URL 刚刚变了, 优先来抓」。失败不阻断部署。
      - name: Notify IndexNow (incremental added modified removed)
        run: npm run indexnow
        continue-on-error: true

      # ── 把本次产物存成下一版的基线 ──
      # 顺序: 先用旧基线算差 → 再更新基线 → 再上传。
      # 只存 sitemap(几十 KB), 不存 dist 全量。
      - name: Save sitemap as next-run baseline
        if: ${{ always() }}
        run: |
          mkdir -p scripts/.indexnow-snapshot
          cp -f dist/sitemap-0.xml scripts/.indexnow-snapshot/snapshot.xml

      # overwrite: true 关键 — 同名 artifact 已存在时默认会上传失败
      # (Artifact name ... already exists), 导致基线永远停在第一版。
      - name: Upload IndexNow baseline artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-snapshot
          path: scripts/.indexnow-snapshot/snapshot.xml
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

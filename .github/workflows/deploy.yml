name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # ── 恢复上一版 sitemap, 作为本次增量 diff 的基线 ──
      # 首次部署时该 artifact 不存在, 此步允许失败: 脚本会判定「无基线」
      # 并退化为全量提交(符合 IndexNow 官方建议: 刚接入时可全量)。
      - name: Restore previous IndexNow baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-snapshot
          path: scripts/.indexnow-snapshot

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f613aea61669133c77d8364ac2e50b66
          command: pages deploy dist --project-name=haomachat --branch=main

      # ── 通知搜索引擎: 本次发布的 URL 新增 / 修改 / 删除 ──
      # 优先级高于 sitemap: sitemap 只说明「URL 存在」, IndexNow 才说明
      # 「这个 URL 刚刚变了, 优先来抓」。失败不阻断部署。
      - name: Notify IndexNow (incremental added modified removed)
        run: npm run indexnow
        continue-on-error: true

      # ── 把本次产物存成下一版的基线 ──
      # 顺序: 先用旧基线算差 → 再更新基线 → 再上传。
      # 只存 sitemap(几十 KB), 不存 dist 全量。
      - name: Save sitemap as next-run baseline
        if: ${{ always() }}
        run: |
          mkdir -p scripts/.indexnow-snapshot
          cp -f dist/sitemap-0.xml scripts/.indexnow-snapshot/snapshot.xml

      - name: Upload IndexNow baseline artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-snapshot
          path: scripts/.indexnow-snapshot/snapshot.xml
          retention-days: 30
          if-no-files-found: warn

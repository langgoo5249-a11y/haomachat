# =====================================================================
# 号码通查 zangxixitech.cn — Nginx 站点配置 (阿里云国内服务器)
# 迁移自 Cloudflare Pages, 详见仓库 deploy/ 目录
#
# 部署位置:
#   /etc/nginx/sites-available/zangxixitech.cn.conf  -> 软链到 sites-enabled/
# 依赖的自动生成文件 (勿手改):
#   /etc/nginx/conf.d/zangxixitech-redirect-map.conf   <- npm run nginx:gen 产出, http 上下文
#   /etc/nginx/snippets/zangxixitech-wildcards.conf    <- 同上, server 上下文通配 301
# 站点根目录:
#   /var/www/zangxixitech.cn/  (Astro build 出的 dist/ 内容)
# =====================================================================

# ---------- HTTP: 仅用于 ACME 校验 + 全量跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name zangxixitech.cn www.zangxixitech.cn;

    # Let's Encrypt / 阿里云证书 的 HTTP-01 校验目录, 必须在跳转之前放行
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://zangxixitech.cn$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    # 用 listen ... http2 而非 http2 on; —— 后者需 nginx >= 1.25,
    # 阿里云 Ubuntu 22.04 / Alibaba Cloud Linux 默认多为 1.18~1.20, 兼容优先
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zangxixitech.cn www.zangxixitech.cn;

    # ---- 证书 (阿里云免费 DV 证书或 Let's Encrypt, 按实际路径替换) ----
    ssl_certificate     /etc/nginx/ssl/zangxixitech.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/zangxixitech.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/zangxixitech.cn;
    index index.html;
    charset utf-8;

    # www 归一化到主域 (与 canonical 保持一致)
    if ($host = www.zangxixitech.cn) {
        return 301 https://zangxixitech.cn$request_uri;
    }

    # ---- 安全响应头 (来自原 public/_headers) ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;

    # ---- gzip (静态站收益明显) ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/rss+xml;

    # =================================================================
    # 重定向: 精确规则 (由 _redirects 自动生成, 149 条)
    # 必须先于 location 生效 —— server 级 rewrite 阶段执行
    # =================================================================
    if ($redirect_to) {
        return 301 $redirect_to;
    }

    # =================================================================
    # 站长验证文件: 直出静态文件, 严禁任何跳转/重写
    # (public/ 下同时保留了带与不带 .html 的实体文件)
    # =================================================================
    location = /baidu_verify_codeva-J2OVio818i.html { try_files $uri =404; }
    location = /baidu_verify_codeva-J2OVio818i      { try_files $uri =404; }
    location = /googleacd9f7914a32bdff.html         { try_files $uri =404; }
    location = /ByteDanceVerify.html                { try_files $uri =404; }
    location = /robots.txt                          { try_files $uri =404; access_log off; }
    location = /sitemap-index.xml                   { try_files $uri =404; }
    location = /sitemap-0.xml                       { try_files $uri =404; }

    # ---- API 反代到本机 Node 服务 (替代 Cloudflare Pages Function) ----
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ---- 带哈希指纹的静态资源: 强缓存 ----
    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
    location /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # =================================================================
    # 通配 301 规则 (来自 _redirects 动态区, 必须排在精确规则之后)
    # =================================================================
    include /etc/nginx/snippets/zangxixitech-wildcards.conf;

    # ---- 静态文件兜底 ----
    location / {
        try_files $uri $uri/ =404;
    }

    # 404 页面 (若站点无自定义 404, 保留默认)
    error_page 404 /404.html;
}

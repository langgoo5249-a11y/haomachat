# =====================================================================
# 通配 301 规则 (来自 _redirects 动态区), server 上下文 include
# 必须置于精确规则(map $redirect_to)判定之后
# =====================================================================
rewrite ^/en/tools/(.*)$ /tools/$1 permanent;
rewrite ^/en/guide/(.*)$ /guide/$1 permanent;
rewrite ^/en/compare/(.*)$ /compare/$1 permanent;
rewrite ^/en/blog/(.*)$ /blog/$1 permanent;
rewrite ^/en/about/(.*)$ /about/$1 permanent;
